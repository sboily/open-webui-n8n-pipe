[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-webui-n8n-pipe"
dynamic = ["version"]
description = "N8N workflow connector for Open-WebUI"
readme = "README.md"
authors = [
    {name = "Sylvain BOILY", email = "sylvainboilydroid@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
keywords = ["open-webui", "n8n", "chatbot", "api", "async"]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
"Homepage" = "https://github.com/sboily/open-webui-n8n-pipe"
"Bug Tracker" = "https://github.com/sboily/open-webui-n8n-pipe/issues"
"Source Code" = "https://github.com/sboily/open-webui-n8n-pipe"
"Open-WebUI Hub" = "https://openwebui.com/f/quintana/n8n_pipe_ng"

[tool.setuptools]
packages = ["n8n_pipe"]

[tool.setuptools.dynamic]
version = {attr = "n8n_pipe.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=n8n_pipe --cov=scripts --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "SIM", "D", "N", "RUF"]
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["open_webui.*"]
ignore_missing_imports = true

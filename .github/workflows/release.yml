name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -e .
      - name: Check that the tag matches n8n_pipe.__version__
        run: |
          version="$(python -c 'import n8n_pipe; print(n8n_pipe.__version__)')"
          test "$version" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"; exit 1; }
      - run: python scripts/build_single_file.py dist/n8n_pipe.py
      - name: Create the GitHub release with the single-file function attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/n8n_pipe.py --generate-notes

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e .
      - name: Build the single-file function
        run: python scripts/build_single_file.py dist/n8n_pipe.py
      - name: Smoke-test the bundle
        run: |
          python - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("n8n_pipe_bundle", "dist/n8n_pipe.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.Pipe().get_webhook_url())
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: n8n_pipe.py
          path: dist/n8n_pipe.py

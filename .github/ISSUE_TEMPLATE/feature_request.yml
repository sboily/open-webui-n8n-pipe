name: Feature request
description: Suggest an improvement to the pipe
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the pipe send to n8n / show in Open-WebUI?
    validations:
      required: true
